spring.application.name=ExpenseTracker

#### PORT CONFIG ####
server.port=8086

#### MYSQL DATASOURCE ####
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/expensetrackerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=expensetrackeradmin
spring.datasource.password=expensetrackeradmin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#### JMX Identifier ####
spring.jmx.default-domain=ExpenseTracker

# ---- DEV ONLY: auto-create schema ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
